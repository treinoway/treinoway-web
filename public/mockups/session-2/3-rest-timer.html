<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Treinoway · Concept 2 — Rest Timer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mockup-label"><strong>C2·03</strong>Timer em tela cheia — não modal</div>
<nav class="mockup-nav">
  <a href="2-superset.html">‹ Anterior</a>
  <a href="index.html">Índice</a>
  <a href="4-editing-completed.html">Próximo ›</a>
</nav>

<div class="device">
  <div class="status-notch"></div>
  <div class="status-bar">
    <span>10:29</span>
    <span class="right">
      <i data-lucide="signal" width="14" height="14"></i>
      <i data-lucide="wifi" width="14" height="14"></i>
      <i data-lucide="battery-full" width="18" height="18"></i>
    </span>
  </div>

  <div class="top-bar">
    <button class="icon-btn"><i data-lucide="chevron-left" width="22" height="22"></i></button>
    <div class="top-bar-center">
      <span class="workout-label">Descanso</span>
      <span class="workout-name">Supino Reto · Série 2</span>
    </div>
    <button class="icon-btn"><i data-lucide="x" width="22" height="22"></i></button>
  </div>

  <div class="ex-progress">
    <div class="ex-seg ex-seg--done"></div>
    <div class="ex-seg ex-seg--active"></div>
    <div class="ex-seg"></div>
    <div class="ex-seg"></div>
    <div class="ex-seg"></div>
  </div>

  <div class="rest-stage">
    <div class="rest-upnext">Próxima série em</div>

    <div class="big-timer">
      <svg viewBox="0 0 280 280">
        <circle class="track" cx="140" cy="140" r="130"/>
        <circle class="fill" cx="140" cy="140" r="130"/>
      </svg>
      <div style="text-align:center; z-index:1;">
        <div class="num">01:23</div>
        <div class="sub">Restante</div>
      </div>
    </div>

    <button class="rest-edit">
      <i data-lucide="pencil" width="12" height="12"></i>
      Tempo desta série: <strong>90s</strong>
    </button>

    <div class="next-preview">
      <div style="width:40px;height:40px;border-radius:10px;background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;">
        <i data-lucide="repeat" width="18" height="18"></i>
      </div>
      <div class="next-preview-main">
        <div class="next-preview-label">A seguir · Série 3</div>
        <div class="next-preview-title">Supino Reto</div>
      </div>
      <div class="next-preview-vals">10 × 40kg</div>
    </div>

    <div class="rest-controls">
      <button class="rest-btn"><i data-lucide="minus" width="14" height="14"></i> 15s</button>
      <button class="rest-btn rest-btn--primary"><i data-lucide="pause" width="16" height="16" fill="currentColor"></i> Pausar</button>
      <button class="rest-btn"><i data-lucide="plus" width="14" height="14"></i> 15s</button>
    </div>

    <button class="obs-btn" style="background: var(--surface-high); padding: 12px 20px; color: var(--text);">
      <i data-lucide="skip-forward" width="14" height="14"></i>
      Pular descanso
    </button>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="interactions.js"></script>
</body>
</html>
