<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Treinoway · Concept 2 — Superset</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mockup-label"><strong>C2·02</strong>Superset — toggle A1/A2 + rodadas</div>
<nav class="mockup-nav">
  <a href="1-focus-set.html">‹ Anterior</a>
  <a href="index.html">Índice</a>
  <a href="3-rest-timer.html">Próximo ›</a>
</nav>

<div class="device">
  <div class="status-notch"></div>
  <div class="status-bar">
    <span>10:42</span>
    <span class="right">
      <i data-lucide="signal" width="14" height="14"></i>
      <i data-lucide="wifi" width="14" height="14"></i>
      <i data-lucide="battery-full" width="18" height="18"></i>
    </span>
  </div>

  <div class="top-bar">
    <button class="icon-btn"><i data-lucide="chevron-left" width="22" height="22"></i></button>
    <div class="top-bar-center">
      <span class="workout-label">Treino B</span>
      <span class="workout-name">Costas e Bíceps</span>
    </div>
    <button class="timer-chip"><i data-lucide="clock" width="14" height="14"></i> 28:17</button>
  </div>

  <div class="ex-progress">
    <div class="ex-seg ex-seg--done"></div>
    <div class="ex-seg ex-seg--done"></div>
    <div class="ex-seg ex-seg--active"></div>
    <div class="ex-seg"></div>
  </div>

  <div class="stage">
    <span class="superset-tag" style="align-self: flex-start;">
      <i data-lucide="link-2" width="11" height="11"></i>
      Superset
    </span>

    <div class="ex-title-row">
      <div class="ex-title-main">
        <h1 class="ex-title">Remada +<br>Rosca Direta</h1>
        <div class="ex-meta">Bloco 3 de 4</div>
      </div>
      <button class="video-btn" aria-label="Vídeo A2">
        <i data-lucide="play" width="20" height="20" fill="currentColor"></i>
      </button>
    </div>

    <!-- Toggle A1 / A2 dentro do bloco -->
    <div class="superset-toggle">
      <button class="toggle-opt toggle-opt--done">
        <span class="dot-tiny"></span>
        A1 · Remada
      </button>
      <button class="toggle-opt toggle-opt--active">
        <span class="dot-tiny"></span>
        A2 · Rosca
      </button>
    </div>

    <!-- Rodada indicator com dots laranja -->
    <div class="round-indicator">
      <span>Rodada <strong>2</strong> de 3</span>
      <span class="rd-dots">
        <span class="rd-dot rd-dot--done"></span>
        <span class="rd-dot rd-dot--active"></span>
        <span class="rd-dot"></span>
      </span>
    </div>

    <!-- Set pills para série ativa de A2 -->
    <div class="set-pills">
      <div class="set-pill set-pill--done"></div>
      <div class="set-pill set-pill--active"></div>
      <div class="set-pill"></div>
    </div>

    <div class="set-context">
      <span class="set-index">Série <strong>2</strong> · A2</span>
      <span class="last-week">
        <i data-lucide="history" width="12" height="12"></i>
        Anterior: <strong>12 × 14kg</strong>
      </span>
    </div>

    <div class="hero-inputs">
      <div class="stepper stepper--active">
        <div class="stepper-label">Reps</div>
        <div class="stepper-value">12</div>
        <span class="stepper-unit">repetições</span>
        <div class="stepper-controls">
          <button class="step-btn"><i data-lucide="minus" width="16" height="16"></i></button>
          <button class="step-btn step-btn--plus"><i data-lucide="plus" width="16" height="16"></i></button>
        </div>
      </div>

      <div class="stepper stepper--active">
        <div class="stepper-label">Carga</div>
        <div class="stepper-value">16</div>
        <span class="stepper-unit">kg</span>
        <div class="stepper-controls">
          <button class="step-btn"><i data-lucide="minus" width="16" height="16"></i></button>
          <button class="step-btn step-btn--plus"><i data-lucide="plus" width="16" height="16"></i></button>
        </div>
      </div>
    </div>

    <button class="confirm-btn">
      <i data-lucide="check" width="24" height="24"></i>
      Concluir A2 · Série 2
    </button>

    <div class="obs-row">
      <button class="obs-btn">
        <i data-lucide="arrow-down" width="12" height="12"></i>
        Sem descanso entre A1 e A2
      </button>
    </div>
  </div>

  <div class="dock">
    <div class="dock-label">
      <span>A seguir · 1</span>
      <a href="#">Ver tudo</a>
    </div>
    <div class="dock-scroll">
      <div class="dock-card">
        <div class="dock-thumb"><i data-lucide="dumbbell" width="18" height="18"></i></div>
        <div class="dock-info">
          <div class="dock-name">Puxada Frontal</div>
          <div class="dock-meta">4 × 10</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="interactions.js"></script>
</body>
</html>
