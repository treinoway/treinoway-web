<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Treinoway · Pular exercício</title>
<link rel="stylesheet" href="styles.css">
<style>
  .skip-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--color-surface);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 10px 20px 28px;
    z-index: 21;
    box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.18);
  }
  .skip-title {
    font-family: var(--font-family-heading);
    font-size: 22px;
    letter-spacing: 0.015em;
    margin-bottom: 4px;
    text-align: center;
  }
  .skip-subtitle {
    font-size: var(--font-body-small-size);
    color: var(--color-on-surface-variant);
    text-align: center;
    margin-bottom: 20px;
  }
  .skip-context {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: var(--radius-full);
    background: var(--color-surface-container);
    font-size: var(--font-caption-size);
    color: var(--color-on-surface-variant);
    margin: 0 auto 20px;
    font-weight: 600;
  }
  .skip-context strong { color: var(--color-on-surface); }
  .skip-context-wrap { text-align: center; }

  .reason-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .reason-chip {
    padding: 14px 12px;
    background: var(--color-surface-container);
    border: 1.5px solid transparent;
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 600;
    color: var(--color-on-surface);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .reason-chip svg { color: var(--color-on-surface-variant); }
  .reason-chip:hover {
    background: var(--color-primary-container);
  }
  .reason-chip--selected {
    background: var(--color-primary-container);
    border-color: var(--color-primary);
    color: var(--color-on-primary-container);
  }
  .reason-chip--selected svg { color: var(--color-primary); }

  .reason-textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--color-surface-container);
    border: 1px solid var(--color-outline-variant);
    border-radius: var(--radius-md);
    font: inherit;
    font-size: 13px;
    resize: none;
    outline: none;
    color: var(--color-on-surface);
    margin-bottom: 16px;
  }
  .reason-textarea:focus { border-color: var(--color-primary); }

  .skip-actions {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 10px;
  }
  .skip-cancel {
    height: 52px;
    border-radius: var(--radius-full);
    background: transparent;
    border: 1px solid var(--color-outline-variant);
    font: inherit;
    font-size: var(--font-button-label-size);
    font-weight: var(--font-button-label-weight);
    letter-spacing: var(--font-button-label-letter-spacing);
    text-transform: uppercase;
    color: var(--color-on-surface-variant);
  }
  .skip-confirm {
    height: 52px;
    border-radius: var(--radius-full);
    background: var(--color-primary);
    border: 0;
    color: #fff;
    font: inherit;
    font-size: var(--font-button-label-size);
    font-weight: var(--font-button-label-weight);
    letter-spacing: var(--font-button-label-letter-spacing);
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .skip-footer-hint {
    margin-top: 10px;
    font-size: 11px;
    color: var(--color-on-surface-variant);
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .skip-footer-hint svg { color: var(--color-primary); }
</style>
</head>
<body>
<div class="mockup-label"><strong>07</strong>Bottom sheet · por que não fez</div>
<nav class="mockup-nav">
  <a href="6-timed-exercise.html">‹ Anterior</a>
  <a href="index.html">Índice</a>
  <a aria-disabled="true">Próximo ›</a>
</nav>

<div class="device">
  <div class="status-notch"></div>
  <div class="status-bar">
    <span>10:31</span>
    <span class="right">
      <i data-lucide="signal" width="14" height="14"></i>
      <i data-lucide="wifi" width="14" height="14"></i>
      <i data-lucide="battery-full" width="18" height="18"></i>
    </span>
  </div>

  <header class="app-header">
    <button class="icon-btn"><i data-lucide="chevron-left" width="22" height="22"></i></button>
    <div class="app-title">Treino A — Peito e Tríceps</div>
    <button class="duration-chip">
      <i data-lucide="clock" width="14" height="14"></i>
      00:17:02
    </button>
  </header>

  <div class="progress">
    <span class="progress-label">Ex. 2 / 5</span>
    <div class="progress-track"><div class="progress-fill" style="width: 32%"></div></div>
  </div>

  <div class="scroll-body" style="opacity: 0.3;">
    <section class="section-label">Agora</section>
    <article class="exercise-card">
      <div class="video-thumb">
        <button class="play-btn"><i data-lucide="play" width="24" height="24" fill="currentColor"></i></button>
      </div>
      <div class="exercise-body">
        <h1 class="exercise-name">Supino Reto com Barra</h1>
        <p class="exercise-meta">3 séries · 10–12 reps · 90s</p>
      </div>
    </article>
  </div>

  <div class="scrim"></div>

  <div class="skip-sheet">
    <div class="sheet-handle"></div>

    <h2 class="skip-title">Por que não fez?</h2>
    <p class="skip-subtitle">Ajuda seu personal a entender e ajustar</p>

    <div class="skip-context-wrap">
      <div class="skip-context">
        <i data-lucide="skip-forward" width="12" height="12"></i>
        Pulando <strong>Supino Reto com Barra</strong>
      </div>
    </div>

    <div class="reason-grid">
      <button class="reason-chip reason-chip--selected">
        <i data-lucide="dumbbell" width="18" height="18"></i>
        Equipamento ocupado
      </button>
      <button class="reason-chip">
        <i data-lucide="heart-pulse" width="18" height="18"></i>
        Dor ou desconforto
      </button>
      <button class="reason-chip">
        <i data-lucide="battery-low" width="18" height="18"></i>
        Fadiga
      </button>
      <button class="reason-chip">
        <i data-lucide="clock" width="18" height="18"></i>
        Falta de tempo
      </button>
      <button class="reason-chip" style="grid-column: 1 / -1;">
        <i data-lucide="message-square" width="18" height="18"></i>
        Outro motivo
      </button>
    </div>

    <textarea class="reason-textarea" rows="2" placeholder="Adicionar observação (opcional)"></textarea>

    <div class="skip-actions">
      <button class="skip-cancel">Cancelar</button>
      <button class="skip-confirm">
        <i data-lucide="skip-forward" width="16" height="16"></i>
        Não fiz
      </button>
    </div>

    <div class="skip-footer-hint">
      <i data-lucide="info" width="12" height="12"></i>
      Você pode refazer este exercício depois
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="interactions.js"></script>
</body>
</html>
