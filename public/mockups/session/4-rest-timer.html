<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Treinoway · Timer de descanso</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mockup-label"><strong>04</strong>Bottom sheet · timer de descanso</div>
<nav class="mockup-nav">
  <a href="3-superset.html">‹ Anterior</a>
  <a href="index.html">Índice</a>
  <a href="2-completed-set.html">Próximo ›</a>
</nav>

<div class="device">
  <div class="status-notch"></div>
  <div class="status-bar">
    <span>10:29</span>
    <span class="right">
      <i data-lucide="signal" width="14" height="14"></i>
      <i data-lucide="wifi" width="14" height="14"></i>
      <i data-lucide="battery-full" width="18" height="18"></i>
    </span>
  </div>

  <header class="app-header">
    <button class="icon-btn"><i data-lucide="chevron-left" width="22" height="22"></i></button>
    <div class="app-title">Treino A — Peito e Tríceps</div>
    <button class="duration-chip">
      <i data-lucide="clock" width="14" height="14"></i>
      00:16:45
    </button>
  </header>

  <div class="progress">
    <span class="progress-label">Ex. 2 / 5</span>
    <div class="progress-track"><div class="progress-fill" style="width: 46%"></div></div>
  </div>

  <!-- Scrim + sheet -->
  <div class="scrim"></div>

  <div class="rest-sheet">
    <div class="sheet-handle"></div>

    <div class="timer-context">
      <strong>Série 2 de 3</strong>
      <span class="divider">·</span>
      <span>Supino Reto</span>
    </div>

    <div class="timer-ring-wrap">
      <svg class="timer-ring" viewBox="0 0 220 220">
        <circle class="track" cx="110" cy="110" r="100"/>
        <circle class="fill" cx="110" cy="110" r="100" stroke-dasharray="628" stroke-dashoffset="188"/>
      </svg>
      <div class="timer-center">
        <div class="timer-number">01:23</div>
        <div class="timer-sub">Descanso</div>
      </div>
    </div>

    <div class="timer-set-edit">
      <span class="label">Tempo desta série</span>
      <span class="value">90s</span>
      <button class="pencil-mini" aria-label="Editar tempo">
        <i data-lucide="pencil" width="14" height="14"></i>
      </button>
    </div>

    <div class="timer-controls">
      <button class="timer-ctrl">
        <i data-lucide="minus" width="16" height="16"></i>
        15s
      </button>
      <button class="timer-ctrl timer-ctrl--primary">
        <i data-lucide="pause" width="16" height="16" fill="currentColor"></i>
        Pausar
      </button>
      <button class="timer-ctrl">
        <i data-lucide="plus" width="16" height="16"></i>
        15s
      </button>
    </div>

    <button class="timer-skip">
      Pular descanso
    </button>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="interactions.js"></script>
</body>
</html>
