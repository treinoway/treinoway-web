name: Unit Tests

on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Native release guard
        run: npm run build:app:release
        env:
          # Deterministic, credential-free: the check only validates the release shape (https, no cleartext, no debugging), never talks to the API.
          VITE_API_BASE_URL: https://api.release-check.invalid
          VITE_SENTRY_DSN: ''
